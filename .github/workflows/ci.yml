name: CI

# A merge to main is live within a minute, and a failed build first shows up in
# the Cloudflare dashboard — which nothing in this repository points at. This
# runs the same two commands locally-first, before the merge button.
on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
