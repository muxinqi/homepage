version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      astro-framework:
        patterns:
          - "astro"
          - "@astrojs/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      cloudflare:
        patterns:
          - "@cloudflare/*"
          - "wrangler"
    # A new TypeScript major lands before `astro check` supports it, and the PR
    # sits red until then. Take majors by hand when Astro's tooling is ready.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
